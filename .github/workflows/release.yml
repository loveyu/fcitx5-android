name: Release Build

on:
  release:
    types:
      - published

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v3
        with:
          packages: cmake;3.31.6

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install extra-cmake-modules gettext

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build release APKs
        env:
          BUILD_VERSION_NAME: ${{ github.event.release.tag_name }}
          SIGN_KEY_BASE64: ${{ secrets.SIGN_KEY_BASE64 }}
          SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
        run: |
          ./gradlew :app:assembleRelease
          ./gradlew :assembleReleasePlugins

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find app/build/outputs/apk/release -type f -name "*.apk" -exec cp -t release-assets {} +
          find plugin -path "*/build/outputs/apk/release/*.apk" -type f -exec cp -t release-assets {} +
          ls -1 release-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ github.event.release.tag_name }}
          path: release-assets/*.apk
          retention-days: 90

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
